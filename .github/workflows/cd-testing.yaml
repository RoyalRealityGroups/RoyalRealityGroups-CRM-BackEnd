name: RRG-BackEnd-Testing-Deploy

on:
  workflow_run:
    workflows:
      - "RRG-BackEnd-Build"
    types:
      - completed
    branches:
      - testing

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      actions: read
      contents: read

    steps:
      - name: Stop Testing Service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            sudo systemctl stop ${{ secrets.BE_TESTING_SERVICE_NAME }}.socket ${{ secrets.BE_TESTING_SERVICE_NAME }}.service || true

      - name: Deploy Testing Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd "${{ secrets.BE_TESTING_TARGET_PATH }}"

            git fetch origin
            git checkout testing
            git reset --hard origin/testing

            source venv/bin/activate

            pip install -r requirements.txt

            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            sudo systemctl start ${{ secrets.BE_TESTING_SERVICE_NAME }}.socket ${{ secrets.BE_TESTING_SERVICE_NAME }}.service
