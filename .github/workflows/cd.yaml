name: RRG-BackEnd-Deploy

on:
  workflow_run:
    workflows: ["RRG-BackEnd-Build"]
    types:
      - completed
    branches:
      - main
      - testing

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      actions: read
      contents: read

    env:
      DEPLOY_PATH: ${{ github.event.workflow_run.head_branch == 'main' && secrets.BE_DEV_TARGET_PATH || secrets.BE_TESTING_TARGET_PATH }}
      SERVICE_NAME: ${{ github.event.workflow_run.head_branch == 'main' && secrets.BE_DEV_SERVICE_NAME || secrets.BE_TESTING_SERVICE_NAME }}

    steps:

      - name: Stop services before deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            sudo systemctl stop ${{ env.SERVICE_NAME }}.socket ${{ env.SERVICE_NAME }}.service || true

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd "${{ env.DEPLOY_PATH }}" &&
            git pull origin "${{ github.event.workflow_run.head_branch }}" &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&
            python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            sudo systemctl start ${{ env.SERVICE_NAME }}.socket ${{ env.SERVICE_NAME }}.service
