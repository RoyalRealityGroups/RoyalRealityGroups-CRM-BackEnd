<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Royal Reality Groups CRM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Royal Reality Groups CRM" />
    <link rel="icon" href="/favicon.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #root:empty ~ #splash,
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .logo-ring {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
        animation: pulse 2s ease-in-out infinite;
      }

      .logo-ring svg {
        width: 44px;
        height: 44px;
        fill: white;
      }

      .brand {
        text-align: center;
      }

      .brand h1 {
        color: #f8fafc;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .brand p {
        color: #94a3b8;
        font-size: 0.85rem;
        margin-top: 4px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .spinner {
        display: flex;
        gap: 6px;
      }

      .spinner span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3b82f6;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .spinner span:nth-child(2) { animation-delay: 0.2s; background: #6366f1; }
      .spinner span:nth-child(3) { animation-delay: 0.4s; background: #8b5cf6; }

      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        50% { box-shadow: 0 0 60px rgba(59, 130, 246, 0.6); }
      }

      #root { width: 100%; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash">
      <div class="logo-ring">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
        </svg>
      </div>
      <div class="brand">
        <h1>Royal Reality Groups</h1>
        <p>CRM Platform</p>
      </div>
      <div class="spinner">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <script>
      // Hide splash once React has mounted
      var observer = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 400);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
