version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dev}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rrg-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-092378r026720760326382623682364}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost}
      - URL_SCHEMA=${URL_SCHEMA:-http}
      - GLOBAL_API_URL=${GLOBAL_API_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5000}
      - SAFE_MODE=${SAFE_MODE:-False}
      - DYNAMICS_SAFE_MODE=${DYNAMICS_SAFE_MODE:-False}
      - FLOW_SAFE_MODE=${FLOW_SAFE_MODE:-False}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - DB_NAME=${DB_NAME:-dev}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - USE_S3=${USE_S3:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-XXXXX}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-XXXXX}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-XXXXX}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-XXXXX}

volumes:
  postgres_data:
